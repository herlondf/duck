[package]
name = "duck"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GPU terminal with a built-in multiplexer, made for working with AI agents"
repository = "https://github.com/herlondf/duck"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
alacritty_terminal = "0.26.0"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
glyphon = "0.12.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
interprocess = "2.4.7"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "send", "serialize"] }
pollster = "1.0.1"
portable-pty = "0.9.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
wasmi = { version = "2.0.0", features = ["wat"] }
wgpu = "30.0.1"
winit = "0.30.13"

# Iteracao: otimizado e sem console (como o release), mas sem LTO e incremental.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console", "Win32_System_Pipes", "Win32_Security"] }

[build-dependencies]
embed-resource = "3"
